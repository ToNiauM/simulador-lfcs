schema_version: 1
id: operations-deployment/core-dump-limits
version: 1.0.0
domain: operations-deployment
weight: 10
estimated_minutes: 6
requires:
  - systemd
  - procps
parameters:
  limits_file: /etc/security/limits.d/60-<seed6>-core.conf
  sysctl_file: /etc/sysctl.d/60-<seed6>-core.conf
  sysctl_key: [fs.suid_dumpable, kernel.core_pattern]
  sysctl_value: ["0", /dev/null]
